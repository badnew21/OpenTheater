<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenTheater Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* A game screen commits to one visual world: the operations-room palette the
   rest of OpenTheater already uses. Every colour is painted outright so the
   page holds on whatever ground the host renders it over. */
:root {
  --ground: #0d1013;
  --panel: rgba(17, 20, 24, 0.9);
  --panel-solid: #151920;
  --edge: rgba(216, 180, 106, 0.22);
  --edge-strong: rgba(216, 180, 106, 0.55);
  --ink: #e2d8c1;
  --dim: #8b8778;
  --gold: #d8b46a;
  --hostile: #c65a44;
  --sign: 'Oswald', 'Haettenschweiler', 'Arial Narrow', sans-serif;
  --text: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--ground); color: var(--ink);
  font-family: var(--text); font-size: 13px;
  -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none;
}
#view {
  position: fixed; inset: 0; width: 100%; height: 100%;
  display: block; background: var(--ground); cursor: crosshair;
  touch-action: none;
}
#view:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }

/* --- chrome ------------------------------------------------------------- */
.bar {
  position: fixed; top: 0; left: 0; right: 0; height: 42px; z-index: 3;
  display: flex; align-items: center; gap: 14px; padding: 0 14px;
  background: linear-gradient(180deg, rgba(9, 11, 14, 0.94), rgba(9, 11, 14, 0.6));
  border-bottom: 1px solid var(--edge);
}
.mark {
  font-family: var(--sign); font-weight: 600; font-size: 15px;
  letter-spacing: 0.3em; color: var(--gold); white-space: nowrap;
}
.mark span { color: var(--dim); }
.bar .note { color: var(--dim); font-size: 11px; margin-left: auto; text-align: right; }
.bar .note b { color: var(--ink); font-weight: 500; }

.panel {
  position: fixed; z-index: 3;
  background: var(--panel); border: 1px solid var(--edge); border-radius: 7px;
  padding: 11px 12px; backdrop-filter: blur(9px);
  box-shadow: 0 12px 38px rgba(0, 0, 0, 0.45);
}
.panel h2 {
  font-family: var(--sign); font-weight: 500; font-size: 12px;
  letter-spacing: 0.22em; color: var(--gold); margin: 0 0 9px;
}
#panel-order { top: 56px; left: 14px; width: 232px; }
#panel-contact { top: 56px; right: 14px; width: 186px; }
#panel-contact.danger { border-color: rgba(198, 90, 68, 0.7); }
#panel-contact.danger h2 { color: var(--hostile); }

/* the order is a form because that is what choosing your ground is */
.field { display: grid; grid-template-columns: 62px 1fr; gap: 7px; align-items: center; margin-bottom: 6px; }
.field > label { color: var(--dim); font-size: 11px; }
.field select {
  width: 100%; background: var(--panel-solid); color: var(--ink);
  border: 1px solid var(--edge); border-radius: 4px;
  font: inherit; font-size: 12px; padding: 4px 5px; cursor: pointer;
}
.field select:hover { border-color: var(--edge-strong); }
.field select:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.check { display: flex; align-items: center; gap: 7px; margin: 8px 0 10px; cursor: pointer; color: var(--dim); font-size: 11px; }
.check input { accent-color: var(--gold); width: 13px; height: 13px; cursor: pointer; }
.check:hover { color: var(--ink); }

.side { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.swatch { width: 9px; height: 22px; border-radius: 2px; flex: none; }
.rule { border: 0; border-top: 1px solid var(--edge); margin: 10px 0 9px; }

.acts { display: grid; gap: 6px; }
button {
  font-family: var(--sign); font-weight: 500; letter-spacing: 0.16em;
  font-size: 11px; padding: 7px 9px; cursor: pointer; border-radius: 4px;
  background: var(--panel-solid); color: var(--ink); border: 1px solid var(--edge);
}
button:hover { border-color: var(--edge-strong); color: var(--gold); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
#deploy { background: rgba(216, 180, 106, 0.14); border-color: var(--edge-strong); color: var(--gold); }
#deploy:hover { background: rgba(216, 180, 106, 0.26); }

.kv { display: flex; justify-content: space-between; gap: 12px; line-height: 1.75; font-size: 12px; }
.kv span:first-child { color: var(--dim); }
.kv span:last-child { font-variant-numeric: tabular-nums; }

/* --- the ground you have walked onto ------------------------------------ */
#card {
  position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%);
  z-index: 2; text-align: center; pointer-events: none; opacity: 0;
  text-shadow: 0 2px 20px rgba(0, 0, 0, 0.9);
}
#card.show { animation: card 3.6s ease forwards; }
#place { font-family: var(--sign); font-weight: 500; font-size: 40px; letter-spacing: 0.14em; color: #f4ead1; }
#sub { font-size: 11px; letter-spacing: 0.3em; color: var(--gold); margin-top: 5px; text-transform: uppercase; }
@keyframes card {
  0% { opacity: 0; transform: translate(-50%, -46%); }
  14% { opacity: 1; transform: translate(-50%, -50%); }
  74% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -54%); }
}
@media (prefers-reduced-motion: reduce) {
  #card.show { animation: none; opacity: 1; }
}

#grab {
  position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%); z-index: 3;
  font-family: var(--sign); letter-spacing: 0.2em; font-size: 11px; color: var(--gold);
  background: rgba(9, 11, 14, 0.86); border: 1px solid var(--edge);
  padding: 6px 15px; border-radius: 5px; opacity: 0; transition: opacity 0.25s;
  pointer-events: none;
}
#grab.on { opacity: 1; }

#keys {
  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 3;
  color: var(--dim); font-size: 11px; white-space: nowrap;
  background: rgba(9, 11, 14, 0.7); padding: 6px 14px; border-radius: 5px;
}
#keys b { color: var(--ink); font-weight: 500; }

#fatal {
  position: fixed; inset: 0; z-index: 9; display: none;
  align-items: center; justify-content: center; padding: 40px;
  background: var(--ground); color: var(--ink); text-align: center; font-size: 15px;
}
#fatal.on { display: flex; }

@media (max-width: 880px) {
  #panel-contact { display: none; }
  #keys { font-size: 10px; }
  #place { font-size: 28px; }
}
@media (max-width: 620px) {
  #panel-order { width: 190px; }
  .bar .note { display: none; }
}
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="Three-dimensional ground view"></canvas>

<div class="bar">
  <div class="mark">OPENTHEATER <span>FIELD</span></div>
  <div class="note">the ground layer of a strategy game · <b>everything here is generated from the seed</b></div>
</div>

<section class="panel" id="panel-order" aria-label="Deployment order">
  <h2>DEPLOYMENT ORDER</h2>
  <div class="field">
    <label for="f-terrain">ground</label>
    <select id="f-terrain"></select>
  </div>
  <label class="check" for="f-coast">
    <input type="checkbox" id="f-coast" checked> put a coastline on it
  </label>

  <hr class="rule">

  <div class="side">
    <div class="swatch" id="sw-you"></div>
    <div class="field" style="flex:1;margin:0">
      <label for="f-you">yours</label>
      <select id="f-you"></select>
    </div>
  </div>
  <div class="field">
    <label for="f-ours">brigades</label>
    <select id="f-ours">
      <option>1</option><option selected>2</option><option>3</option><option>4</option>
    </select>
  </div>

  <div class="side" style="margin-top:10px">
    <div class="swatch" id="sw-them"></div>
    <div class="field" style="flex:1;margin:0">
      <label for="f-them">theirs</label>
      <select id="f-them"></select>
    </div>
  </div>
  <div class="field">
    <label for="f-enemy">brigades</label>
    <select id="f-enemy">
      <option>0</option><option>1</option><option>2</option><option selected>3</option><option>4</option>
    </select>
  </div>

  <hr class="rule">
  <div class="acts">
    <button id="deploy" type="button">TAKE THE FIELD</button>
    <button id="reroll" type="button" title="Generate a different piece of ground">NEW GROUND</button>
  </div>
</section>

<section class="panel" id="panel-contact" aria-label="Contact report">
  <h2>CONTACT</h2>
  <div id="contact"></div>
</section>

<div id="card"><div id="place"></div><div id="sub"></div></div>
<div id="grab">click the ground to look around</div>
<div id="keys">
  <b>WASD</b> move · <b>mouse</b> look · <b>shift</b> sprint · <b>space</b> jump · <b>ctrl</b> crouch · <b>wheel</b> camera in and out
</div>
<div id="fatal"></div>

<script type="module" src="/src/ground/standalone.ts"></script>
</body>
</html>
